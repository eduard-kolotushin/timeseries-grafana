services:
  grafana:
    user: root
    container_name: 'eduardkolotushin-forecast-app'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana}
        grafana_version: ${GRAFANA_VERSION:-13.1.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
      - 2345:2345/tcp # delve
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    volumes:
      - ../dist:/var/lib/grafana/plugins/eduardkolotushin-forecast-app
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/eduardkolotushin-forecast-app

    environment:
      NODE_ENV: development
      GF_DEFAULT_APP_MODE: development
      GF_LOG_FILTERS: plugin.eduardkolotushin-forecast-app:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: eduardkolotushin-forecast-app,eduardkolotushin-forecast-panel,eduardkolotushin-forecast-datasource
