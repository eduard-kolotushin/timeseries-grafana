name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: overlay
          POSTGRES_PASSWORD: overlay
          POSTGRES_DB: overlay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overlay -d overlay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORECAST_TEST_PG: postgres://overlay:overlay@localhost:5432/overlay?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Format
        run: test -z "$(gofmt -l ./pkg ./cmd ./Magefile.go)"
      # Explicit paths, not ./...: the module tree also contains
      # node_modules/flatted/golang, which is not this module's code.
      - name: Go test
        run: go test -race ./pkg/... ./cmd/...
      # CI otherwise never produces the artifacts Grafana actually runs, so a
      # linux-only compile break would pass go test on the runner.
      - name: Build the linux backend
        run: GOOS=linux GOARCH=amd64 go build -o /tmp/gpx_forecast_linux_amd64 ./pkg
      - name: Build the linux migrator
        run: GOOS=linux GOARCH=amd64 go build -o /tmp/gpx_forecast_migrate_linux_amd64 ./cmd/migrate
      # The migration CLI is what a CD pipeline runs before Grafana starts. The
      # pg-gated Go tests already cover the from-scratch, legacy-schema and
      # concurrency paths; this proves the shipped binary's own DSN chain and
      # exit code against a real Postgres, and that re-running is a no-op.
      - name: Migration CLI
        env:
          FORECAST_STORE_URL: ${{ env.FORECAST_TEST_PG }}
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate | grep -q "nothing to apply"
          go run ./cmd/migrate --dry-run | grep -q "nothing to apply"
      - name: Frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:ci
          npm run build
