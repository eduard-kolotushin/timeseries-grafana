name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Format
        run: test -z "$(gofmt -l ./pkg)"
      - name: Go test
        run: go test ./pkg/...
      - name: Frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:ci
          npm run build
