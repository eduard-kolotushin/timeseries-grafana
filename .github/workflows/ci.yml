name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: overlay
          POSTGRES_PASSWORD: overlay
          POSTGRES_DB: overlay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overlay -d overlay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORECAST_TEST_PG: postgres://overlay:overlay@localhost:5432/overlay?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Format
        run: test -z "$(gofmt -l ./pkg)"
      - name: Go test
        run: go test ./pkg/...
      - name: Frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:ci
          npm run build
